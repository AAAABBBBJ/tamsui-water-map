<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<base target="_top">
<title>淡水河流域公民水質地圖</title>

<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500;700&family=Noto+Serif+TC:wght@700&family=IBM+Plex+Mono:wght@400;500&display=swap">
<style>
/* 版面：投影用單螢幕應用。頂列＝標題＋分頁＋項目＋月份；下方一個分頁佔滿剩餘高度，不需捲動。 */
:root {
  --bg: #eef3f4; --panel: #ffffff; --ink: #0f2a33; --muted: #4d646b; --line: #d0dcdf;
  --water: #7fb0cc; --water-soft: #d3e6ef; --accent: #0d6688;
  --good: #22915f; --warn: #d39b12; --bad: #c9432f; --na: #aebdc1;
  --fix: #3f84d4; --ask: #e0a91d; --official: #6450b8; --rain: #3f84d4;
  --c1: #0f6b8f; --c2: #cf4c39; --c3: #2b9a69; --c4: #8a5cc2; --c5: #d98a1c; --c6: #1a9aa3; --c7: #c2477f; --c8: #6b7d1f; --c9: #4a5fc1; --c10: #8a6142;
  --veil: rgba(15,42,51,.10);
  --font-display: "Noto Serif TC", "Songti TC", serif;
  --font-body: "Noto Sans TC", "PingFang TC", "Microsoft JhengHei", system-ui, sans-serif;
  --font-data: "IBM Plex Mono", ui-monospace, "SFMono-Regular", monospace;
}
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) {
  --bg: #0c1a1f; --panel: #12252c; --ink: #e6f0f2; --muted: #9db3b9; --line: #26434c;
  --water: #3f7ea3; --water-soft: #1b3a47; --accent: #5cb6dc;
  --good: #3fbf86; --warn: #e6b93e; --bad: #ec6a55; --na: #4d6870; --fix: #6ea8ec; --ask: #e6b93e; --official: #a597ef; --rain: #6ea8ec;
  --c1: #5cb6dc; --c2: #ec6a55; --c3: #3fbf86; --c4: #b48cf0; --c5: #f0a640; --c6: #3cc8c8; --c7: #e57aa8; --c8: #a8bf45; --c9: #8a9cf5; --c10: #c49a72;
  --veil: rgba(0,0,0,.28); color-scheme: dark } }
:root[data-theme="dark"] {
  --bg: #0c1a1f; --panel: #12252c; --ink: #e6f0f2; --muted: #9db3b9; --line: #26434c;
  --water: #3f7ea3; --water-soft: #1b3a47; --accent: #5cb6dc;
  --good: #3fbf86; --warn: #e6b93e; --bad: #ec6a55; --na: #4d6870; --fix: #6ea8ec; --ask: #e6b93e; --official: #a597ef; --rain: #6ea8ec;
  --c1: #5cb6dc; --c2: #ec6a55; --c3: #3fbf86; --c4: #b48cf0; --c5: #f0a640; --c6: #3cc8c8; --c7: #e57aa8; --c8: #a8bf45; --c9: #8a9cf5; --c10: #c49a72;
  --veil: rgba(0,0,0,.28); color-scheme: dark }

html, body { height: 100%; margin: 0; }
body { background: var(--bg); color: var(--ink); font-family: var(--font-body); line-height: 1.5;
  font-size: clamp(14px, 0.42vw + 8.5px, 19px);
  padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); padding-block: 12px;
  display: flex; flex-direction: column; gap: 10px; box-sizing: border-box; }
h1, h2, h3 { margin: 0; text-wrap: balance; }
.num { font-family: var(--font-data); font-variant-numeric: tabular-nums; }
button { font: inherit; color: inherit; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
[hidden] { display: none !important; }

header { display: flex; flex-wrap: wrap; gap: 8px 20px; align-items: center; }
h1 { font-family: var(--font-display); font-size: 1.45em; line-height: 1.2; }
.sub { color: var(--muted); font-size: .8em; }
.tabs { display: flex; gap: 2px; background: var(--line); padding: 3px; border-radius: 10px; }
.tabs button { border: 0; background: transparent; padding: .3em .9em; border-radius: 8px; cursor: pointer; font-weight: 500; }
.tabs button[aria-selected="true"] { background: var(--panel); color: var(--accent); box-shadow: 0 1px 2px var(--veil); }
.bar { display: flex; flex-wrap: wrap; gap: 8px 18px; align-items: center; margin-left: auto; }
.seg { display: flex; gap: 4px; flex-wrap: wrap; }
.seg button { border: 1px solid var(--line); background: var(--panel); padding: .2em .75em; border-radius: 999px; cursor: pointer; font-size: .9em; }
.seg button[aria-pressed="true"] { background: var(--accent); color: var(--panel); border-color: var(--accent); }
.month { display: flex; align-items: center; gap: 8px; }
.month input { width: clamp(140px, 16vw, 320px); accent-color: var(--accent); }
.month .lbl { font-family: var(--font-data); font-size: 1.05em; min-width: 4.6em; font-weight: 500; }
.play { border: 1px solid var(--line); background: var(--panel); border-radius: 999px; width: 2em; height: 2em; cursor: pointer; }

main { flex: 1; min-height: 0; display: flex; }
.view { flex: 1; min-height: 0; min-width: 0; display: grid; gap: 12px; }
.card { background: var(--panel); border: 1px solid var(--line); border-radius: 12px; padding: 12px 14px; min-width: 0; min-height: 0; display: flex; flex-direction: column; }
.card h2 { font-size: 1em; display: flex; justify-content: space-between; align-items: baseline; gap: 10px; flex-wrap: wrap; }
.card h2 small { font-weight: 400; font-size: .78em; color: var(--muted); }
.legend { display: flex; flex-wrap: wrap; gap: 4px 14px; font-size: .78em; color: var(--muted); }
.legend i { display: inline-block; width: .8em; height: .8em; border-radius: 50%; margin-right: 5px; vertical-align: -1px; }
.chart { width: 100%; display: block; flex: 1; min-height: 0; }
.chart text { fill: var(--muted); font-family: var(--font-data); }
.toggles { display: flex; gap: 14px; flex-wrap: wrap; font-size: .82em; }
.toggles label { display: flex; align-items: center; gap: 5px; cursor: pointer; }

/* 地圖 */
#v-map { grid-template-columns: minmax(0, 1.75fr) minmax(0, 1fr); }
.mapbox { position: relative; flex: 1; min-height: 0; }
#map { position: absolute; inset: 0; width: 100%; height: 100%; }
.mapfoot { display: flex; justify-content: space-between; gap: 8px 16px; flex-wrap: wrap; align-items: center; padding-top: 6px; }
.site-name { font-family: var(--font-display); font-size: 1.5em; }
.vals { display: grid; grid-template-columns: repeat(5, minmax(0, 1fr)); gap: 6px; margin: 8px 0; }
.val { border: 1px solid var(--line); border-radius: 8px; padding: 4px 7px; cursor: pointer; background: transparent; text-align: left; }
.val[aria-pressed="true"] { border-color: var(--accent); box-shadow: inset 0 0 0 1px var(--accent); }
.val .k { font-size: .72em; color: var(--muted); display: block; }
.val .v { font-family: var(--font-data); font-size: 1.15em; display: flex; align-items: center; gap: 5px; }
.dot { width: .6em; height: .6em; border-radius: 50%; flex: none; }
.status { font-size: .75em; padding: 1px 8px; border-radius: 4px; font-weight: 500; white-space: nowrap; }
.st-原始值 { background: color-mix(in srgb, var(--good) 18%, transparent); }
.st-調整值 { background: color-mix(in srgb, var(--fix) 22%, transparent); }
.st-待查核 { background: color-mix(in srgb, var(--ask) 32%, transparent); }
.st-未填報 { background: color-mix(in srgb, var(--na) 30%, transparent); }
.meta { color: var(--muted); font-size: .82em; }
.note { font-size: .82em; display: flex; flex-direction: column; gap: 3px; margin-top: 6px; }
.note p { margin: 0; }
.note .lab { color: var(--muted); margin-right: 6px; }
.tip { position: absolute; pointer-events: none; background: var(--ink); color: var(--panel); font-size: .8em; padding: 4px 8px; border-radius: 6px; white-space: nowrap; transform: translate(-50%, -130%); z-index: 2; }

/* 趨勢 */
#v-trend { grid-template-rows: auto minmax(0, 1fr); }
.chips { display: flex; gap: 6px; flex-wrap: wrap; align-items: center; }
.chip { border: 1px solid var(--line); background: var(--panel); border-radius: 999px; padding: .1em .7em; font-size: .85em; cursor: pointer; display: inline-flex; align-items: center; gap: 6px; }
.chip i { width: .8em; height: .25em; border-radius: 2px; display: inline-block; }
.chip[aria-pressed="false"] { opacity: .55; }
.mini { border: 1px solid var(--line); background: transparent; border-radius: 6px; padding: .1em .6em; font-size: .8em; cursor: pointer; }
.grid6 { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); grid-template-rows: repeat(2, minmax(0, 1fr)); gap: 12px; min-height: 0; }
table.snap { width: 100%; border-collapse: collapse; font-size: .8em; }
table.snap th, table.snap td { padding: 3px 5px; border-bottom: 1px solid var(--line); text-align: right; }
table.snap th:first-child, table.snap td:first-child { text-align: left; }
table.snap th { font-weight: 500; color: var(--muted); }
.scroll { overflow: auto; min-height: 0; }

/* 官方對照 */
#v-official { grid-template-columns: minmax(0, 1fr) minmax(0, 1.35fr); }
.finding { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 10px; margin: 6px 0 10px; }
.finding div { border-top: 3px solid var(--accent); padding-top: 6px; }
.finding b { display: block; font-size: 1.25em; font-family: var(--font-data); }
.finding span { font-size: .8em; color: var(--muted); }
table.pairs { width: 100%; border-collapse: collapse; font-size: .85em; }
table.pairs th, table.pairs td { padding: 5px 6px; border-bottom: 1px solid var(--line); text-align: right; }
table.pairs th:nth-child(-n+2), table.pairs td:nth-child(-n+2) { text-align: left; }
table.pairs th { color: var(--muted); font-weight: 500; font-size: .9em; }
table.pairs tr.row { cursor: pointer; }
table.pairs tr.row:hover td { background: color-mix(in srgb, var(--accent) 7%, transparent); }
table.pairs tr.sel td { background: color-mix(in srgb, var(--accent) 13%, transparent); }
.neg { color: var(--bad); } .pos { color: var(--good); }
.two { display: grid; grid-template-rows: repeat(2, minmax(0, 1fr)); gap: 6px; flex: 1; min-height: 0; }
.two > div { display: flex; flex-direction: column; min-height: 0; }

/* 資料檢核 */
#v-qa { grid-template-columns: minmax(0, 1.6fr) minmax(0, 1fr); }
.heat { overflow: auto; }
.heat table { border-collapse: separate; border-spacing: 3px; font-size: .85em; width: 100%; table-layout: fixed; min-width: 640px; }
.heat col.c0 { width: 6.5em; } .heat col.cr { width: 3.2em; }
.heat th { font-weight: 400; color: var(--muted); white-space: nowrap; text-align: right; padding-right: 6px; }
.heat thead th { text-align: center; font-family: var(--font-data); font-size: .85em; padding: 0; }
.heat td { height: 2.1em; border-radius: 3px; cursor: pointer; padding: 0; }
.heat td.h-原始值 { background: color-mix(in srgb, var(--good) 45%, transparent); }
.heat td.h-調整值 { background: var(--fix); }
.heat td.h-待查核 { background: var(--ask); }
.heat td.h-缺 { box-shadow: inset 0 0 0 1px var(--na); }
.heat td.h-前 { background: repeating-linear-gradient(135deg, transparent 0 3px, var(--line) 3px 4px); cursor: default; }
.heat td.cur { outline: 2px solid var(--ink); }
.heat td.rate { width: auto; font-family: var(--font-data); color: var(--muted); cursor: default; padding-left: 6px; }
.why ul { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 8px; font-size: .85em; }
.why li { display: grid; grid-template-columns: 6px minmax(0, 1fr); gap: 9px; cursor: pointer; }
.why li .b { border-radius: 3px; }
.why .act { color: var(--muted); font-size: .9em; }
.why .sum { color: var(--muted); font-size: .8em; margin: 2px 0 8px; }
footer { font-size: .7em; color: var(--muted); }

/* 窄螢幕：改為上下堆疊、可捲動 */
@media (max-width: 960px), (max-height: 560px) {
  html, body { height: auto; }
  main { display: block; }
  .view { display: flex; flex-direction: column; }
  .mapbox { height: 60vw; min-height: 300px; flex: none; }
  .grid6 { display: flex; flex-direction: column; }
  .grid6 > .card, .two > div { height: 260px; flex: none; }
  .two { display: flex; flex-direction: column; }
  .finding { grid-template-columns: minmax(0, 1fr); }
  .bar { margin-left: 0; }
  .vals { grid-template-columns: repeat(3, minmax(0, 1fr)); }
  #siteChart { height: 200px; flex: none; }
}
@media (prefers-reduced-motion: reduce) { * { transition: none !important; } }
</style>
</head>
<body>


<header>
  <div>
    <h1>淡水河流域公民水質調查</h1>
    <div class="sub" id="facts"></div>
  </div>
  <nav class="tabs" role="tablist" aria-label="檢視">
    <button role="tab" data-v="map">地圖</button>
    <button role="tab" data-v="trend">趨勢</button>
    <button role="tab" data-v="official">官方對照</button>
    <button role="tab" data-v="qa">資料檢核</button>
  </nav>
  <div class="bar">
    <div class="seg" id="params" role="group" aria-label="項目"></div>
    <div class="month">
      <button class="play" id="play" aria-label="逐月播放">▶</button>
      <input type="range" id="month" min="0" max="21" aria-label="月份">
      <span class="lbl" id="monthLbl"></span>
    </div>
  </div>
</header>

<main>
  <!-- 地圖 -->
  <section class="view" id="v-map">
    <div class="card">
      <h2>水系示意圖 <small id="mapNote"></small></h2>
      <div class="mapbox" id="mapbox"><svg id="map" role="img" aria-label="淡水河流域與桃園水系示意圖"></svg><div class="tip" id="tip" hidden></div></div>
      <div class="mapfoot">
        <div class="legend" id="legend"></div>
        <div class="toggles">
          <label><input type="checkbox" id="tgOfficial" checked> 環境部測站</label>
          <label><input type="checkbox" id="tgMask"> 檢核狀態</label>
          <label><input type="checkbox" id="tgRain"> 雨量</label>
        </div>
      </div>
    </div>
    <aside class="card" id="panel" aria-live="polite"></aside>
  </section>

  <!-- 趨勢 -->
  <section class="view" id="v-trend" hidden>
    <div class="chips"><span id="chips" class="chips"></span><button class="mini" id="all">全選</button><button class="mini" id="none">清除</button></div>
    <div class="grid6" id="grid6"></div>
  </section>

  <!-- 官方對照 -->
  <section class="view" id="v-official" hidden>
    <div class="card">
      <h2>公民調查與環境部測站 <small>同一年月配對</small></h2>
      <div class="finding" id="finding"></div>
      <div class="scroll"><table class="pairs" id="pairs"></table></div>
      <div class="meta" style="margin-top:6px">位置、時間與水深不同，看落差方向，不逐月判定對錯。</div>
    </div>
    <div class="card">
      <h2 id="pairTitle"></h2>
      <div class="legend" id="pairLegend" style="margin:4px 0"></div>
      <div class="two"><div><svg class="chart" id="pc1" role="img" aria-label="水溫對照"></svg></div><div><svg class="chart" id="pc2" role="img" aria-label="溶氧對照"></svg></div></div>
    </div>
  </section>

  <!-- 資料檢核 -->
  <section class="view" id="v-qa" hidden>
    <div class="card">
      <h2>填報與檢核 <small>點格子切換月份與點位</small></h2>
      <div class="heat scroll" id="heat"></div>
      <div class="legend" style="margin-top:6px">
        <span><i style="background:color-mix(in srgb,var(--good) 45%,transparent)"></i>原始值</span>
        <span><i style="background:var(--fix)"></i>調整值</span>
        <span><i style="background:var(--ask)"></i>待查核</span>
        <span><i style="box-shadow:inset 0 0 0 1px var(--na)"></i>未填報</span>
        <span><i style="background:repeating-linear-gradient(135deg,transparent 0 3px,var(--line) 3px 4px)"></i>尚未加入</span>
      </div>
    </div>
    <div class="card why"><div id="why" class="scroll"></div></div>
  </section>
</main>

<footer>資料：聯盟水質監測上傳表單（北水分署）、環境部全國環境水質監測資訊網、中央氣象署 CODiS。燈號依議程附件二觀察門檻，僅供觀察，不作法規判定。</footer>

function showTip(el, t) { const box = $('#mapbox').getBoundingClientRect(), r = el.getBoundingClientRect(); const tip = $('#tip');

// ---------- 折線圖（依容器實際尺寸繪製，文字維持固定大小） ----------
function lineChart(svg, series, pk, opt = {}) {

  svg.setAttribute('viewBox', `0 0 ${Wc} ${Hc}`);
  const Pm = PARAMS[pk], [d0, d1] = Pm.dom, iw = Wc - m.l - m.r, ih = Hc - m.t - m.b;
  const X = i => m.l + iw * i / (MONTHS.length - 1), Y = v => m.t + ih * (1 - (Math.max(d0, Math.min(d1, v)) - d0) / (d1 - d0));
  let h = '';
  if (opt.bars) { const mx = Math.max(...opt.bars.filter(Boolean), 1);
    opt.bars.forEach((b, i) => { if (b == null) return; const bh = ih * .45 * b / mx; h += `<rect x="${X(i) - 4}" y="${m.t + ih - bh}" width="8" height="${bh}" fill="${C('--rain')}" opacity=".22"/>`; }); }
  Pm.ticks.forEach(t => { h += `<line x1="${m.l}" x2="${Wc - m.r}" y1="${Y(t)}" y2="${Y(t)}" stroke="${C('--line')}"/><text x="${m.l - 5}" y="${Y(t) + fs * .35}" text-anchor="end" font-size="${fs}">${t}</text>`; });
  MONTHS.forEach((mo, i) => { if (mo.endsWith('-01') || mo.endsWith('-07')) h += `<text x="${X(i)}" y="${Hc - 4}" text-anchor="middle" font-size="${fs}">${mo.slice(2).replace('-', '/')}</text>`; });
  h += `<line x1="${X(st.m)}" x2="${X(st.m)}" y1="${m.t}" y2="${m.t + ih}" stroke="${C('--ink')}" opacity=".35"/>`;
  series.forEach(s => {
    let seg = [], segs = [];
    if (s.dash) { s.vals.forEach((v, i) => { if (v != null) seg.push([X(i), Y(v)]); }); segs = [seg]; }
    else { s.vals.forEach((v, i) => { if (v == null) { if (seg.length) segs.push(seg); seg = []; } else seg.push([X(i), Y(v)]); }); if (seg.length) segs.push(seg); }
    segs.forEach(sg => { h += sg.length > 1 ? `<polyline points="${sg.map(p => p.join(',')).join(' ')}" fill="none" stroke="${s.color}" stroke-width="${s.dash ? 1.8 : 2.4}" ${s.dash ? 'stroke-dasharray="6 4"' : ''} stroke-linejoin="round"/>` : ''; });
    s.vals.forEach((v, i) => { if (v != null) h += `<circle cx="${X(i)}" cy="${Y(v)}" r="${i === st.m ? 4.5 : s.dash ? 2.2 : 2.6}" fill="${s.dash ? C('--panel') : s.color}" stroke="${s.dash ? s.color : C('--panel')}" stroke-width="${s.dash ? 1.8 : i === st.m ? 1.5 : 0}"/>`; });
  });
  if (opt.title !== false) h += `<text x="${m.l}" y="${fs * 1.1}" font-size="${fs * 1.15}" font-weight="500" style="fill:var(--ink)">${opt.title || Pm.name}${Pm.unit ? '（' + (opt.unit || Pm.unit) + '）' : ''}</text>`;
  svg.innerHTML = h;
  svg.style.cursor = 'crosshair';
  svg.onclick = e => { const b = svg.getBoundingClientRect(); const i = Math.round(((e.clientX - b.left) / b.width * Wc - m.l) / iw * (MONTHS.length - 1));
    if (i >= 0 && i < MONTHS.length) { st.m = i; render(); } };
}
const series = (k, pk) => MONTHS.map(m => { const r = REC[k + '|' + m]; return r ? r[pk] : null; });
const offSeries = (sid, pk) => MONTHS.map(m => { const r = D.official[sid].recs.find(x => x.ym === m); return r ? r[PARAMS[pk].of] : null; });
const rainFor = k => Object.values(D.rain).find(r => r.sites.includes(k));

// ---------- 官方對照 ----------
function corr(a, b) { const n = a.length; if (n < 4) return null; const ma = a.reduce((x, y) => x + y) / n, mb = b.reduce((x, y) => x + y) / n;
  let sab = 0, sa = 0, sb = 0; for (let i = 0; i < n; i++) { sab += (a[i] - ma) * (b[i] - mb); sa += (a[i] - ma) ** 2; sb += (b[i] - mb) ** 2; } return sa && sb ? sab / Math.sqrt(sa * sb) : null; }
const PSTAT = D.pairs.map(([k, sid, rel]) => {
  const o = D.official[sid]; const tA = [], tB = [], dA = [], dB = []; let n = 0;
  o.recs.forEach(x => { const r = REC[k + '|' + x.ym]; if (!r) return; n++;
    if (r.t != null && x.temp != null) { tA.push(r.t); tB.push(x.temp); }
    if (r.o != null && x.do != null) { dA.push(r.o); dB.push(x.do); } });
  const avg = a => a.length ? a.reduce((x, y) => x + y) / a.length : null;
  return { k, sid, rel, n, r: corr(tA, tB), dc: avg(dA), doff: avg(dB) };
});
function drawOfficial() {

    <div><b>${Math.min(...diffs.map(Math.abs)).toFixed(1)}–${Math.max(...diffs.map(Math.abs)).toFixed(1)} ppm</b><span>石門、翡翠、老街溪溶氧低於官方</span></div>

// ---------- 資料檢核 ----------

      h += `<td class="h-${before ? '前' : r ? r.st : '缺'}${i === st.m ? ' cur' : ''}" data-k="${s.k}" data-m="${i}" title="${SN(s.k)} ${ymL(m)}：${before ? '尚未加入' : r ? r.st : '未填報'}"></td>`; });
    h += `<td class="rate">${Math.round(n / e * 100)}%</td></tr>`; });
  $('#heat').innerHTML = h + '</tbody></table>';
  $('#heat').querySelectorAll('td[data-k]').forEach(td => td.addEventListener('click', () => { if (td.classList.contains('h-前')) return; st.site = td.dataset.k; st.m = +td.dataset.m; render(); }));
  const ym = MONTHS[st.m]; const items = []; let ok = 0; const miss = [];

  items.sort((a, b) => a.r.st < b.r.st ? 1 : -1).forEach(({ k, r }) => {
    w += `<li data-k="${k}"><span class="b" style="background:var(${r.st === '待查核' ? '--ask' : '--fix'})"></span><div><b>${SN(k)}</b> <span class="status st-${r.st}">${r.st}</span>` +

  if (miss.length) w += `<li><span class="b" style="box-shadow:inset 0 0 0 1px var(--na)"></span><div><b>未填報</b><div>${miss.map(SN).join('、')}</div></div></li>`;
  if (!items.length && !miss.length) w += '<li><span></span><div class="meta">本月全部為原始值。</div></li>';
  $('#why').innerHTML = w + '</ul>';
  $('#why').querySelectorAll('li[data-k]').forEach(li => li.addEventListener('click', () => { st.site = li.dataset.k; setView('map'); }));
}

$('#none').addEventListener('click', () => { st.cmp = []; render(); });
$('#play').addEventListener('click', () => {
  if (st.timer) { clearInterval(st.timer); st.timer = null; $('#play').textContent = '▶'; return; }
  $('#play').textContent = '❚❚'; st.timer = setInterval(() => { st.m = (st.m + 1) % MONTHS.length; render(); }, 1200);
});
document.addEventListener('keydown', e => { if (e.target.tagName === 'INPUT' && e.target.type !== 'range') return;
  if (e.key === 'ArrowRight' && e.target.type !== 'range') { st.m = Math.min(MONTHS.length - 1, st.m + 1); render(); }
  if (e.key === 'ArrowLeft' && e.target.type !== 'range') { st.m = Math.max(0, st.m - 1); render(); } });
$('#facts').textContent = `${new Set(D.sites.map(s => NAME(s.k))).size} 場域・${D.sites.length} 點位・${D.records.length} 筆・${ymL(MONTHS[0])}–${ymL(MONTHS[MONTHS.length - 1])}・每月第一個週二採樣`;
let rt; addEventListener('resize', () => { clearTimeout(rt); rt = setTimeout(render, 120); });
matchMedia('(prefers-color-scheme: dark)').addEventListener('change', render);
new MutationObserver(render).observe(document.documentElement, { attributes: true, attributeFilter: ['data-theme'] });
render();
</script>

</body>
</html>
